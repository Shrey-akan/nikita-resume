services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shreyans-resume
    ports:
      - "8090:8080"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
